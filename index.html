<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Fiora</title>

    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAFAFB" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#21262D" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Fiora" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Apply saved theme before first paint to prevent splashscreen flash -->
    <script>
      ;(function () {
        try {
          var root = document.documentElement
          var storedTheme = localStorage.getItem("theme")
          var resolvedTheme =
            storedTheme === "dark" || storedTheme === "light"
              ? storedTheme
              : storedTheme === "system" &&
                  window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
          root.classList.remove("light", "dark")
          root.classList.add(resolvedTheme)
          root.style.colorScheme = resolvedTheme

          var storedAppTheme = localStorage.getItem("app-theme")
          if (
            storedAppTheme === "nyoklat" ||
            storedAppTheme === "burgundy" ||
            storedAppTheme === "jandes"
          ) {
            root.setAttribute("data-theme", storedAppTheme)
          } else {
            root.removeAttribute("data-theme")
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
